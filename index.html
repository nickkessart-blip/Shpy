<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1017" />
    <meta name="description" content="SHPY — шпионский аркадный шутер." />
    <title>SHPY — Прототип</title>
    <style>
      :root { color-scheme: dark; background: #0b1017; }
      * { box-sizing: border-box; }
      html, body, #app {
        width: 100%; height: 100%; min-height: 100%;
        margin: 0; overflow: hidden; background: #0b1017;
      }
      body { position: fixed; inset: 0; touch-action: none; }
      #app { position: fixed; inset: 0; display: grid; place-items: center; }
      #game {
        position: relative; width: 100%; height: 100%;
        min-width: 0; min-height: 0; overflow: hidden;
        background: #111821;
      }
      #game canvas { display: block; touch-action: none; }
      #boot-status {
        position: fixed; z-index: 2000; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        max-width: min(90vw, 560px); padding: 18px 24px;
        border: 1px solid #8b6e48; border-radius: 10px;
        color: #f4e1bf; background: #111b26;
        font: 700 15px/1.5 Arial, sans-serif; text-align: center;
        box-shadow: 0 12px 40px #0009;
      }
      #boot-status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
    </div>
    <div id="boot-status" role="status" aria-live="polite">ЗАПУСК SHPY…</div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
