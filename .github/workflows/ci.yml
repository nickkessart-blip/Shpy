name: CI
on:
  push:
    branches-ignore:
      - prototype-build
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not let one PR cancel another PR's checks.
concurrency:
  group: shpy-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build

      - name: Upload Web build for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shpy-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-build:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shpy-web-build
          path: dist/

      - name: Publish downloadable Web build branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/shpy-prototype-build
          cp -R dist/. /tmp/shpy-prototype-build/
          git -C /tmp/shpy-prototype-build init -b prototype-build
          git -C /tmp/shpy-prototype-build config user.name "github-actions[bot]"
          git -C /tmp/shpy-prototype-build config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/shpy-prototype-build add .
          git -C /tmp/shpy-prototype-build commit -m "build: publish Shpy Web prototype"
          git -C /tmp/shpy-prototype-build remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C /tmp/shpy-prototype-build push --force origin HEAD:prototype-build
