name: Deploy SHPY to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npm run typecheck
          npm run test
          npm run lint
      - name: Build for GitHub Pages
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      # GitHub's artifact metadata can lag behind a successful upload by a few seconds.
      # Give deploy-pages time to discover the just-uploaded github-pages artifact.
      - name: Wait for Pages artifact registration
        run: sleep 8
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
